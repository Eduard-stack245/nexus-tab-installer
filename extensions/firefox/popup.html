<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark}body{box-sizing:border-box;background:#111521;color:#f1edff;font:14px system-ui;width:328px;padding:16px;margin:0}
h1{font-size:19px;margin:0 0 8px}p{line-height:1.5;color:#bbc2d6}button{width:100%;margin:6px 0;border:1px solid #474564;border-radius:11px;background:#262b41;color:#e9e3ff;padding:12px;font-weight:600;cursor:pointer}
button.primary{background:#755bdf;color:white;border-color:#755bdf}#status{border-radius:11px;padding:12px;background:#1a2033;color:#b6bfda;white-space:pre-wrap;line-height:1.5;margin:12px 0}
small{color:#97a1b9} .brand{color:#beaaff}
</style></head><body>
<h1><span class="brand">◈</span> Nexus Tab Collector</h1>
<p>Собирает ссылки модов Nexus из всех окон этого профиля, не переключая вкладки.</p>
<div id="status" role="status" aria-live="polite">Проверяем подключение…</div>
<button class="primary" id="grant" hidden>Разрешить доступ к Nexus</button>
<button class="primary" id="pair">Подключить к программе</button>
<button id="sync">Проверить подключение и обновить список</button>
<small>Откройте Nexus Tab Installer и подтвердите запрос доступа один раз. Никакие другие сайты не передаются.</small>
<script src="popup.js"></script></body></html>
